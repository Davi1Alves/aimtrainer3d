<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aim Range 3D</title>
<style>
:root{color-scheme:dark;--red:#ff4655;--navy:#0f1923;--ice:#ece8e1;--cy:#3dffe0}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;font-family:system-ui,sans-serif;color:var(--ice);touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#cross{position:fixed;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;z-index:5}

#xprev{width:96px;height:96px;background:#1b2733;flex:none}.xrow{display:flex;gap:12px;align-items:center}.xc{flex:1}.xc label{margin:6px 0;font-size:12px;justify-content:space-between}.xc select,.xc input[type=color]{width:96px}.xc input[type=range]{width:96px;flex:none}summary{cursor:pointer;color:var(--red);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:34px;font-weight:800;letter-spacing:.08em;text-shadow:0 0 6px #000;pointer-events:none;text-transform:uppercase;z-index:5}
#hud div{text-align:center;font-size:12px;opacity:.9}#hud b{display:block;font-size:30px;color:#fff}
#hud .t b{color:var(--red)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0f1923cc,#05080cf2);z-index:20}
.card{width:min(460px,92vw);max-height:94vh;overflow:auto;padding:28px;background:#0f1923;border:1px solid #ff465566;box-shadow:0 0 40px #ff465533;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
h1{margin:0 0 4px;font-size:34px;letter-spacing:.12em;color:var(--red)}
.sub{margin:0 0 16px;opacity:.75;line-height:1.5;font-size:14px}
button{display:block;width:100%;margin:8px 0;padding:13px;background:var(--red);color:#fff;border:0;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));-webkit-tap-highlight-color:transparent}
button:hover{background:#ff6672}button small{display:block;font-weight:400;letter-spacing:0;text-transform:none;opacity:.85;margin-top:2px}
button.alt{background:#1f2b38;border:1px solid #ff465588}
label{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-size:13px}
input[type=range]{flex:1;accent-color:var(--red)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:10px 0 14px;text-align:center}
.res div{background:#1b2733;padding:10px 4px;font-size:11px;text-transform:uppercase;opacity:.95}.res b{display:block;font-size:24px;color:var(--red)}
.note{font-size:11px;opacity:.55;margin-top:10px}

/* Mobile controls */
#fireBtn,#pauseBtn{display:none;z-index:15;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
#fireBtn{
  position:fixed;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(28px,env(safe-area-inset-bottom));
  width:92px;height:92px;border-radius:50%;
  background:rgba(255,70,85,.82);border:3px solid #fff;
  color:#fff;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  align-items:center;justify-content:center;
  box-shadow:0 0 24px #ff465566;
}
#fireBtn.active{background:#ff4655;transform:scale(.93)}
#pauseBtn{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  left:max(12px,env(safe-area-inset-left));
  width:46px;height:46px;border-radius:10px;
  background:rgba(15,25,35,.9);border:1px solid #ff465566;
  color:#fff;font-size:18px;font-weight:700;
  align-items:center;justify-content:center;
}
body.mobile.playing #fireBtn,
body.mobile.playing #pauseBtn{display:flex}

body.mobile #hud{gap:18px}
body.mobile #hud b{font-size:24px}
body.mobile .card{padding:22px 18px}
body.mobile button{padding:15px 12px;font-size:15px}
</style>
</head>
<body>
<svg id="cross" viewBox="-48 -48 96 96" shape-rendering="crispEdges"></svg>
<div id="hud"><div>Pontos<b id="sc">0</b></div><div class="t">Tempo<b id="tm">60</b></div><div>Precisão<b id="ac">–</b></div><div id="hsw" style="display:none">HS<b id="hs">–</b></div></div>

<button id="fireBtn">FIRE</button>
<button id="pauseBtn">❚❚</button>

<div id="ov"><div class="card">
<h1>AIM RANGE</h1><p class="sub" id="sub">Treino de mira em 3D. Sensibilidade na mesma conversão do VALORANT (0,07° por contagem).</p>
<div id="res"></div>
<button data-m="grid">Gridshot<small>3 alvos ao mesmo tempo</small></button>
<button data-m="flick">Flick<small>1 alvo pequeno, longe e em profundidade</small></button>
<button data-m="track">Tracking<small>Segure o botão esquerdo no alvo em movimento</small></button>
<button data-m="head">Headshot<small>Bonecos com ~1,8 m (altura de um agente) em strafe</small></button>
<button data-m="prec">Precisão<small>Bolas do tamanho de uma cabeça · acertar o centro vale mais</small></button>
<button class="alt" id="cont" style="display:none">Continuar</button>
<details open><summary>Arma e cenário</summary><div class="xc" style="margin-top:6px">
<label>Cenário <select id="ssc" style="width:170px"></select></label>
<label>Arma <select id="swp" style="width:170px"></select></label>
<label>Skin <select id="ssk" style="width:170px"></select></label>
<label>Tempo <select id="stime" style="width:170px">
  <option value="30">30 segundos</option>
  <option value="60">60 segundos</option>
  <option value="90">90 segundos</option>
  <option value="inf">Infinito</option>
</select></label>
</div><button class="alt" id="vw" style="padding:7px;font-size:11px">Visualizar arma e cenário</button></details>
<details open><summary>Mira</summary><div class="xrow"><svg id="xprev" viewBox="-48 -48 96 96" shape-rendering="crispEdges"></svg><div class="xc">
<label>Formato <select id="xs"><option value="cross">Cruz</option><option value="dot">Cruz + ponto</option><option value="only">Só ponto</option><option value="circle">Círculo</option><option value="t">Cruz em T</option></select></label>
<label>Cor <input type="color" id="xcol"></label>
<label>Espessura <input type="range" id="xt" min="1" max="6" step="1"></label>
<label>Tamanho <input type="range" id="xl" min="2" max="20" step="1"></label>
<label>Abertura <input type="range" id="xg" min="0" max="20" step="1"></label>
<label><span>Contorno preto</span><input type="checkbox" id="xo"></label>
</div></div><button class="alt" id="xr" style="padding:7px;font-size:11px">Restaurar mira padrão</button></details>
<label>Sens <input type="range" id="sens" min=".1" max="2" step=".05"><b id="sv"></b></label>
<p class="note" id="note">Para computador (mouse e teclado). Esc pausa · R recarrega a arma. O melhor resultado de cada modo fica salvo neste navegador.</p>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);

const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);

function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=ren.capabilities.getMaxAnisotropy();return t}
function noise(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*a})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}}
const floorT=tex(512,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#1a2733');gr.addColorStop(1,'#101a24');g.fillStyle=gr;g.fillRect(0,0,w,h);noise(g,w,h,2500,.08);
 g.strokeStyle='rgba(236,232,225,.07)';g.lineWidth=2;for(let i=128;i<w;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.moveTo(0,i);g.lineTo(w,i);g.stroke()}
 g.strokeStyle='rgba(255,70,85,.65)';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4);g.fillStyle='rgba(255,70,85,.8)';g.fillRect(0,0,26,6);g.fillRect(0,0,6,26)},[8,9.5]);
const wallT=tex(512,512,(g,w,h)=>{g.fillStyle='#142230';g.fillRect(0,0,w,h);noise(g,w,h,3000,.05);
 g.fillStyle='#1b2c3c';g.fillRect(14,14,w-28,h-28);g.strokeStyle='#2c4258';g.lineWidth=3;g.strokeRect(14,14,w-28,h-28);
 g.strokeStyle='rgba(255,70,85,.12)';g.lineWidth=18;for(let i=-h;i<w;i+=70){g.beginPath();g.moveTo(i,h);g.lineTo(i+h,0);g.stroke()}
 g.fillStyle='#ff4655';g.fillRect(30,30,40,5);g.fillRect(w-70,h-35,40,5)},[8,3.5]);
const targetT=tex(256,256,(g,w,h)=>{const gr=g.createRadialGradient(w*.35,h*.3,8,w/2,h/2,w*.75);gr.addColorStop(0,'#ffb0b8');gr.addColorStop(.45,'#ff4655');gr.addColorStop(1,'#7a1622');g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=2;for(let i=0;i<=w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.moveTo(0,i);g.lineTo(w,i);g.stroke()}});

plane(32,38,M(floorT,.35),0,0,-13,-Math.PI/2,0);
plane(32,14,wm,0,7,-32,0,0);plane(32,14,wm,0,7,6,0,Math.PI);

plane(38,14,wl,-16,7,-13,0,Math.PI/2);plane(38,14,wl,16,7,-13,0,-Math.PI/2);
plane(32,38,new THREE.MeshStandardMaterial({color:0x0a1119,roughness:1}),0,14,-13,Math.PI/2,0);
const neon=new THREE.MeshBasicMaterial({color:0xff4655});
[[32,.14,.14,0,.07,-31.9],[32,.14,.14,0,13.9,-31.9],[.14,.14,38,-15.9,.07,-13],[.14,.14,38,15.9,.07,-13],[.14,.14,38,-15.9,13.9,-13],[.14,.14,38,15.9,13.9,-13]]
 .forEach(([w,h,d,x,y,z])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),neon);m.position.set(x,y,z);scene.add(m)});

[[0xff4655,-10,7,-18,1.4],[0x3dffe0,10,7,-18,.9],[0xffffff,0,6,-4,.8]].forEach(([c,x,y,z,i])=>{const l=new THREE.PointLight(c,i,45);l.position.set(x,y,z);scene.add(l)});
// alvos
const targets=[],parts=[],marks=[],tg=new THREE.SphereGeometry(1,32,24),halo=new THREE.SphereGeometry(1.28,20,16);
const G={state:'menu',mode:'grid',t:60,score:0,shots:0,hits:0,onT:0,tot:0,last:new THREE.Vector3(),cd:0,rt:[]};
function mkTarget(r){
 const m=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({map:targetT,emissive:0xff4655,emissiveIntensity:.3,roughness:.25,metalness:.1}));
 m.scale.setScalar(r);m.userData={r,v:new THREE.Vector3(),ch:0,age:0,born:0};
 m.add(new THREE.Mesh(halo,new THREE.MeshBasicMaterial({color:0xff4655,transparent:true,opacity:.14,side:THREE.BackSide,depthWrite:false})));
 scene.add(m);targets.push(m);return m;
}
function place(t){
 const m=G.mode;let p;
 for(let k=0;k<40;k++){
  p=m=='grid'?new THREE.Vector3(R(-8,8),R(1.5,7),-20):m=='prec'?new THREE.Vector3(R(-9,9),R(1.2,2.3),R(-8,-26)):new THREE.Vector3(R(-11,11),R(1,8),R(-14,-26));
  if(m=='flick'?G.last.distanceTo(p)>6:targets.every(o=>o===t||o.position.distanceTo(p)>3))break;
 }
 t.position.copy(p);G.last.copy(p);t.userData.age=0;t.userData.born=performance.now();
}
function burst(p,n=16){
 for(let i=0;i<n;i++){

  m.position.copy(p);m.userData={v:new THREE.Vector3(R(-1,1),R(-.5,1),R(-1,1)).multiplyScalar(6),life:.5};scene.add(m);parts.push(m);
 }
}
// arma animada (viewmodel preso à câmera)
scene.add(cam);
const gun=new THREE.Group(),GA={r:0,flash:0,rel:-1,sx:0,sy:0,mdx:0,mdy:0};
const GM={};['b','d','k','a','s'].forEach(r=>GM[r]=new THREE.MeshStandardMaterial({metalness:.6,roughness:.35}));
const gparts=[];
const gpart=(w,h,d,c,x,y,z,rx=0)=>{const role={0x2a3440:'b',0x1b232c:'d',0x10151a:'k',0xff4655:'a',0x1f2a36:'s'}[c]||c;const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),GM[role]);o.position.set(x,y,z);o.rotation.x=rx;o.userData.y0=y;gun.add(o);gparts.push(o);return o};
gpart(.06,.07,.42,0x2a3440,0,0,-.05);gpart(.064,.05,.24,0x1b232c,0,-.008,-.33);gpart(.022,.022,.2,0x10151a,0,.005,-.55);
gpart(.05,.08,.2,0x2a3440,0,-.01,.25);gpart(.05,.14,.06,0x1b232c,0,-.1,.1,.25);gpart(.02,.03,.05,0x10151a,0,.05,-.2);
gpart(.064,.012,.26,0xff4655,0,.02,-.05,0,.2);gpart(.075,.075,.34,0x1f2a36,0,-.1,.32,.15,.1);
let mag=gpart(.04,.17,.07,0x1b232c,0,-.12,-.06,-.12);
const flash=new THREE.Mesh(new THREE.CircleGeometry(.09,10),new THREE.MeshBasicMaterial({color:0xffd88a,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
flash.position.set(0,.005,-.68);flash.visible=false;gun.add(flash);
const mLight=new THREE.PointLight(0xffc070,0,8);mLight.position.set(0,0,-.75);gun.add(mLight);
gun.position.set(.2,-.2,-.42);cam.add(gun);
// armas, skins e cenários
const WP={
 rifle:{n:'Fuzil',mz:-.68,o:[.2,-.2,-.42],k:1,fl:1,p:[[.06,.07,.42,'b',0,0,-.05],[.064,.05,.24,'d',0,-.008,-.33],[.022,.022,.2,'k',0,.005,-.55],[.05,.08,.2,'b',0,-.01,.25],[.05,.14,.06,'d',0,-.1,.1,.25],[.02,.03,.05,'k',0,.05,-.2],[.064,.012,.26,'a',0,.02,-.05],[.075,.075,.34,'s',0,-.1,.32,.15],[.04,.17,.07,'d',0,-.12,-.06,-.12,1]]},
 pistol:{n:'Pistola',mz:-.3,o:[.17,-.19,-.4],k:.6,fl:.7,p:[[.05,.055,.26,'b',0,.02,-.12],[.045,.035,.24,'d',0,-.02,-.1],[.02,.02,.05,'k',0,.02,-.27],[.045,.12,.06,'d',0,-.08,.02,.2],[.015,.02,.02,'k',0,.055,-.22],[.052,.01,.18,'a',0,.04,-.12],[.07,.07,.3,'s',0,-.1,.25,.15],[.035,.03,.05,'d',0,-.15,.03,.2,1]]},
 sniper:{n:'Sniper',mz:-1.03,o:[.2,-.2,-.4],k:1.8,fl:1.4,p:[[.06,.08,.5,'b',0,0,-.05],[.026,.026,.6,'k',0,.01,-.62],[.04,.04,.1,'d',0,.01,-.97],[.055,.1,.34,'b',0,-.02,.33],[.05,.13,.06,'d',0,-.1,.12,.25],[.045,.045,.28,'k',0,.085,-.08],[.06,.06,.06,'k',0,.085,-.24],[.055,.055,.05,'k',0,.085,.07],[.04,.04,.01,'a',0,.085,-.275],[.062,.012,.3,'a',0,.02,-.05],[.075,.075,.36,'s',0,-.1,.34,.15],[.04,.1,.07,'d',0,-.08,-.02,-.05,1]]},
 smg:{n:'Submetralhadora',mz:-.5,o:[.19,-.2,-.4],k:.8,fl:.9,p:[[.06,.075,.34,'b',0,0,-.05],[.07,.06,.16,'d',0,-.005,-.28],[.02,.02,.1,'k',0,.005,-.42],[.04,.06,.16,'b',0,0,.22],[.05,.13,.06,'d',0,-.1,.08,.25],[.025,.025,.06,'k',0,.055,-.12],[.062,.012,.2,'a',0,.025,-.04],[.075,.075,.3,'s',0,-.1,.3,.15],[.035,.22,.06,'d',0,-.16,-.12,0,1]]}
};
const SK={
 padrao:{n:'Padrão',b:0x2a3440,d:0x1b232c,k:0x10151a,a:0xff4655,s:0x1f2a36,m:.6,r:.35,e:0},
 ouro:{n:'Ouro',b:0xd4af37,d:0x8a6d1f,k:0x2b2410,a:0xfff1a8,s:0x1f2a36,m:.95,r:.2,e:0},
 gelo:{n:'Gelo',b:0xcfe8f5,d:0x7fa6c0,k:0x3a5266,a:0x7fe7ff,s:0x2a4660,m:.4,r:.25,e:0},
 magma:{n:'Magma',b:0x2b1410,d:0x160a07,k:0x0a0504,a:0xff6a00,s:0x1f1210,m:.5,r:.45,e:1},
 cyber:{n:'Cyber',b:0x1a0f2e,d:0x0e0820,k:0x07040d,a:0x00e5ff,s:0x150d28,m:.7,r:.3,e:1},
 holo:{n:'Holográfica',b:0x20242c,d:0x14171c,k:0x0b0d10,a:0xffffff,s:0x1f2a36,m:.8,r:.2,e:1,rb:1}
};
const SCN={
 range:{n:'Range Neon',bg:0x0b1219,neon:0xff4655,L:[0xff4655,0x3dffe0,0xffffff],amb:0x8fa3b8,ceil:0x0a1119},
 desert:{n:'Deserto',bg:0x2a1a12,neon:0xffb347,L:[0xff8a3d,0xffd27a,0xfff1d6],amb:0xc9a27a,ceil:0x1a1008,T:{f:['#6b4f35','#4d3624','rgba(255,220,170,.12)','#ffb347'],w:['#7a5a3d','#8c6a49','#a07a55','#ffb347']}},
 ice:{n:'Gelo',bg:0x0e1b2a,neon:0x7fe7ff,L:[0x7fe7ff,0xbfe9ff,0xffffff],amb:0xaecbe6,ceil:0x0b1622,T:{f:['#9fc6e0','#6f9bbb','rgba(255,255,255,.28)','#7fe7ff'],w:['#2a4660','#3a6080','#4a7aa0','#bff4ff']}},
 cyber:{n:'Cyber',bg:0x0a0612,neon:0xc13cff,L:[0xc13cff,0x00e5ff,0xff3ca8],amb:0x8070b0,ceil:0x07040d,T:{f:['#1a1030','#0e0820','rgba(193,60,255,.32)','#00e5ff'],w:['#150d28','#1f1238','#2d1a50','#c13cff']}}
};
function thTex(T){
 const [f1,f2,fl,fb]=T.f,[w0,w1,w2,wa]=T.w;
 const f=tex(512,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,f1);gr.addColorStop(1,f2);g.fillStyle=gr;g.fillRect(0,0,w,h);noise(g,w,h,2500,.08);g.strokeStyle=fl;g.lineWidth=2;for(let i=128;i<w;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.moveTo(0,i);g.lineTo(w,i);g.stroke()}g.strokeStyle=fb;g.lineWidth=4;g.globalAlpha=.7;g.strokeRect(2,2,w-4,h-4);g.globalAlpha=1},[8,9.5]);
 const wd=(g,w,h)=>{g.fillStyle=w0;g.fillRect(0,0,w,h);noise(g,w,h,3000,.05);g.fillStyle=w1;g.fillRect(14,14,w-28,h-28);g.strokeStyle=w2;g.lineWidth=3;g.strokeRect(14,14,w-28,h-28);g.globalAlpha=.12;g.strokeStyle=wa;g.lineWidth=18;for(let i=-h;i<w;i+=70){g.beginPath();g.moveTo(i,h);g.lineTo(i+h,0);g.stroke()}g.globalAlpha=1;g.fillStyle=wa;g.fillRect(30,30,40,5);g.fillRect(w-70,h-35,40,5)};
 return{f,w:tex(512,512,wd,[8,3.5]),s:tex(512,512,wd,[9.5,3.5])};

function setScn(id){

ren.domElement.addEventListener('touchmove',e=>{
  if(G.state!=='play'||!isMobile||lookTouchId===null) return;
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===lookTouchId){
      const dx=t.clientX-lastTX, dy=t.clientY-lastTY;
      lastTX=t.clientX; lastTY=t.clientY;
      const k=sens*.07*Math.PI/180*2.2; // multiplicador extra para toque
      yaw-=dx*k;
      pitch=Math.max(-1.5,Math.min(1.5,pitch-dy*k));
      GA.mdx+=dx; GA.mdy+=dy; trackMv({movementX:dx,movementY:dy});
    }
  }
},{passive:false});

ren.domElement.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookTouchId) lookTouchId=null;
  }
});
ren.domElement.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookTouchId) lookTouchId=null;
  }
});

// Fire button (mobile + também funciona no desktop se quiser)
const fireBtn=$('fireBtn');
function setFire(down){
  mouseDown=down;
  fireBtn.classList.toggle('active',down);
  if(down && G.state==='play' && G.mode!=='track' && G.cd<=0 && GA.rel<0){
    shoot();
    G.cd=.1;
  }
}
['touchstart','mousedown'].forEach(ev=>{
  fireBtn.addEventListener(ev,e=>{
    e.preventDefault(); e.stopPropagation();
    setFire(true);
  },{passive:false});
});
['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>{
  fireBtn.addEventListener(ev,e=>{
    e.preventDefault();
    setFire(false);
  });
});

// Pause button (mobile)
$('pauseBtn').addEventListener('click',()=>{
  if(G.state!=='play') return;
  G.state='paused';
  exitPlay();
  $('sub').textContent='Pausado.';pauseFeedback();
  $('cont').style.display='block';
  $('ov').style.display='flex';
});

// Desktop shoot
addEventListener('mousedown',e=>{
 if(isMobile||!locked||G.state!='play'||e.button!=0)return;
 mouseDown=true;
 if(G.mode!='track'&&G.cd<=0&&GA.rel<0){shoot();G.cd=.1}
});

const rc=new THREE.Raycaster(),c0=new THREE.Vector2(0,0);
function shoot(){
 G.shots++;rc.setFromCamera(c0,cam);if(G.mode=='head')return shootHead();
 const h=rc.intersectObjects(targets,false)[0];
 if(h){
  const t=h.object;fire(h.point);G.hits++;burst(t.position);beep(950,.09,'triangle',.18);
  const rt=(performance.now()-t.userData.born)/1000;
  if(G.mode=='prec'){const c=Math.min(1,h.point.distanceTo(t.position)/t.userData.r);G.rt.push(rt);G.score+=Math.round(100-c*50);G.cs+=1-c}else if(G.mode=='flick'){G.rt.push(rt);G.score+=100+Math.max(0,Math.round(100-rt*60))}else{G.rt.push(rt);G.score+=100}
  place(t);
 }else{
  beep(130,.06,'square',.07);
  const w=rc.intersectObjects(walls,false)[0];fire(w?w.point:rc.ray.at(60,new THREE.Vector3()));logMiss();
  if(w){
   const m=new THREE.Mesh(new THREE.CircleGeometry(.09,12),new THREE.MeshBasicMaterial({color:0x04070a}));
   const n=w.face.normal.clone().transformDirection(w.object.matrixWorld);
   m.position.copy(w.point).addScaledVector(n,.012);m.lookAt(w.point.clone().add(n));scene.add(m);marks.push(m);
   if(marks.length>40)scene.remove(marks.shift());
  }
 }
}

// Atualiza texto de ajuda
if(isMobile){
  $('note').textContent='Mobile: Arraste a tela para mirar · Botão FIRE para atirar (segure no Tracking) · Botão ❚❚ pausa. O melhor resultado de cada modo fica salvo neste navegador.';
  $('sub').textContent='Treino de mira em 3D. Arraste a tela para mirar e use o botão FIRE.';
}

// loop
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;G.cd-=dt;
 cam.rotation.set(pitch,yaw,0,'YXZ');
 const play=locked&&G.state=='play';
 if(play){
  if(isFinite(G.t)) G.t-=dt;
  G.el+=dt;
  if(G.mode=='track'){
   const t=targets[0],u=t.userData;u.ch-=dt;
   if(u.ch<=0){u.ch=R(.5,1.4);const a=R(0,6.28),s=R(4,8);u.v.set(Math.cos(a)*s,Math.sin(a)*s*.6,0)}
   t.position.addScaledVector(u.v,dt);
   if(Math.abs(t.position.x)>9){t.position.x=Math.sign(t.position.x)*9;u.v.x*=-1}
   if(t.position.y<1.3||t.position.y>7.5){t.position.y=Math.max(1.3,Math.min(7.5,t.position.y));u.v.y*=-1}
   G.tot+=dt;rc.setFromCamera(c0,cam);
   const on=mouseDown&&GA.rel<0&&rc.intersectObject(t,false).length>0;
   if(mouseDown&&GA.rel<0&&G.cd<=0){G.cd=.108;fire(rc.ray.at(40,new THREE.Vector3()));beep(220,.03,'square',.04)}
   if(on){G.onT+=dt;G.score=Math.round(G.onT*100)}else if(mouseDown&&GA.rel<0)logTrack(t,dt);
   t.material.emissiveIntensity=on?1:.3;
  }
  if(isFinite(G.t) && G.t<=0)finish();
 }
 for(const t of targets){const u=t.userData;u.age+=dt;t.scale.setScalar(u.r*Math.min(1,u.age/.12+.05))}
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i],u=p.userData;u.life-=dt;p.position.addScaledVector(u.v,dt);u.v.y-=12*dt;p.material.opacity=Math.max(0,u.life*2);
  if(u.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();parts.splice(i,1)}
 }
 $('sc').textContent=G.score;
 $('tm').textContent=isFinite(G.t)?Math.max(0,Math.ceil(G.t)):'∞';
 const a=G.mode=='track'?(G.tot?G.onT/G.tot:null):(G.shots?G.hits/G.shots:null);
 $('ac').textContent=a==null?'–':Math.round(a*100)+'%';
 animGun(dt,now);updExtra(dt,now,play);ren.render(scene,cam);
}
requestAnimationFrame(loop);
</script>
